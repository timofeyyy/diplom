    upstream grpc_backend {
        server localhost:12000; 
    }
    server {
        listen 8080;
        http2  on;
        server_name localhost;

        location / {
            grpc_pass grpc://grpc_backend;

            grpc_set_header Content-Type "application/grpc";
            grpc_set_header Proxy-Connection "";
            grpc_set_header x-forwarded-proto http;
            grpc_set_header grpc-accept-encoding identity;
            grpc_set_header TE trailers;
        }
    }

    server {
        listen 3000 ssl;
        http2  on;
        server_name localhost;

        ssl_certificate C:/final-study-proj/ssl/rootCA.pem;
        ssl_certificate_key C:/final-study-proj/ssl/rootCA.key;
    
        location /peerjs/ {
            proxy_pass http://localhost:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /socket.io/ {
            proxy_pass http://localhost:9000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /auth-serv/ {
            proxy_pass http://localhost:10000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        # без слеша в конце будует http://localhost:10000/auth-serv/*, со слешом будет http://localhost:10000/*
        location /front-serv/ {
            proxy_pass http://localhost:4200/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            grpc_pass grpc://grpc_backend;

            grpc_set_header Content-Type "application/grpc";
            grpc_set_header Proxy-Connection "";
            grpc_set_header x-forwarded-proto http;
            grpc_set_header grpc-accept-encoding identity;
            grpc_set_header TE trailers;
        }

        # location / {
