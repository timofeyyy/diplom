<main>
    <section class="window">
        <h3>Подвтерждение пароля</h3>
        @if(response) {
            @if(response.statusCode < 400) {
                <div class="message success">
                    <h4>Ваш пароль был <span>успешно</span> изменен.</h4>
                </div>
            }
            @else {
                 <div class="message invalid">
                    <h4>Похоже что срок действии ссылки истек или просто невалиден.</h4>
                </div>
            }
        }
        <div>
            <button (click)="auth()">Вернуться к аунтефикации</button>
        </div>
    </section>
</main>
