<main>
    <section class="window">
        <h3>Password confirming</h3>
        @if(response) {
            @if(response.statusCode < 400) {
                <div class="message success">
                    <h4>Your password has been <span>successfully</span> changed! 🎉</h4>
                </div>
            }
            @else {
                 <div class="message invalid">
                    <h4>Oops! It seems this link has expired or is invalid. ⚠️</h4>
                </div>
            }
        }
        <div>
            <button (click)="auth()">Go to Login</button>
        </div>
