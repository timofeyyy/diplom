<div class="notification">
    <!-- <div class="icon-wrapper">
        <img class="icon" [src]="notification.data.avatar" />
    </div> -->
      <app-avatar  [avatar]="notification.data.avatar" [options]="notification.data.displayAvatarSettings!" [borderRadius]="20"
            [size]="'max(3vw, 30px)'" />
    <div class="message-block">
        <p class="paragraph">Вас хочет добавить в друзья {{notification.data.userName}}</p>
        <div class="createdAt">
            <p class="paragraph time">{{ notification.createdAt | timeAgo: currentDate }}</p>
        </div>
    </div>
    <p class="action" (click)="userSetings()">Смотреть профиль</p>
</div>
