<div class="field-change">
    <div class="window">
        <h3>Заполните поле</h3>
        <div class="field" [ngClass]="{'focused': focus, 'warning': warning}">
            <p>Никнейм</p>
            <input class="underlined-input" [(ngModel)]="username" [ngModelOptions]="{ standalone: true }" type="text" placeholder="Search"
                (focus)="focus = true" (blur)="focus = false" (change)="validateField()">

            @if(warning) {
            <p class="err">{{warning}}</p>
            }
        </div>
        <footer>
            <button class="transparent color-main-theme" (click)="close.emit()">Назад</button>
            <button class="transparent color-main-theme" (click)="validate()">Сохранить</button>
        </footer>
    </div>
</div>
