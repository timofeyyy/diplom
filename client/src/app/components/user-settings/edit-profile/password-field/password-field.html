<div class="field-change">
    <div class="window">
        <h3>Заполните поле</h3>
        <div class="field" [ngClass]="{'focused': focus, 'warning': validation.password.error}">
            <p>Новый пароль</p>
            <input class="underlined-input" [(ngModel)]="newPassword" type="password" [ngModelOptions]="{ standalone: true }"
                (focus)="focus = true" (blur)="focus = false" (change)="validateField()">
            @if(validation.password.error) {
                <p class="err">{{validation.password.error}}</p>  
            }  
        </div> 
        <footer>
            <button class="transparent color-main-theme" (click)="close.emit()">Отмена</button>
            <button class="transparent color-main-theme" (click)="validate()">Сохранить</button>
        </footer>
    </div>
</div>
