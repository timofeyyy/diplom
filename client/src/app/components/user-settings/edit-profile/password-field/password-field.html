<div class="field-change">
    <div class="window">
        <!-- @if(loader) {
            <app-loader />
        } -->
        <h3>Fill the field</h3>
        <div class="field" [ngClass]="{'focused': focus, 'warning': validation.password.error}">
            <p>New Password</p>
            <input [(ngModel)]="newPassword" type="password" [ngModelOptions]="{ standalone: true }"
                (focus)="focus = true" (blur)="focus = false" (change)="validateField()">
            @if(validation.password.error) {
                <p class="err">{{validation.password.error}}</p>  
            }  
        </div>
        <footer>
            <button (click)="close.emit()">Cancel</button>
            <button (click)="validate()">Send</button>
        </footer>
    </div>
</div>
