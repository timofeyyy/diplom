<div class="field-change">
    <div class="window">
        <h3>Статус</h3>
        <div class="field field-horizontal">
            <p>Показывать</p>
            <app-custom-on-off-switcher class="switcher" [value]="status" (onStateChnged)="status = $event" />

        </div>
        <footer>
            <button class="transparent color-main-theme" (click)="close.emit()">Назад</button>
            <button class="transparent color-main-theme" (click)="send()">Сохранить</button>
        </footer>
    </div>
</div>
