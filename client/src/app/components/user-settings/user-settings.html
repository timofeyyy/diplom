<main class="popup-window">
    <div class="window" #window>
        <header>
            <div class="left">
                @if(History.length > 1) {
                    <img class="back" src="/assets/images/back.svg" alt="back" (click)="back()">
                }
                @if(state === SettingsOptions.USER_EDIT) {
                    <h3>Info</h3>
                }
            </div>
            <div class="right">
                @if(state === SettingsOptions.USER_VIEW) {
                    <img class="edit" src="/assets/images/edit.svg" alt="edit" (click)="openNewWindow(SettingsOptions.USER_EDIT)">
                }
                <img class="close" src="/assets/images/close.svg" alt="close" (click)="close()">
            </div>

        </header>
        <section class="main">
            @switch (state) {   
                @case(SettingsOptions.USER_VIEW) {
                    <app-view-profile class="component" />
                }
                @case(SettingsOptions.OTHER_USER_VIEW) {
                    <app-view-other-profile class="component" [opponent]="user" />
                }
                @case (SettingsOptions.USER_EDIT) {
                    <app-edit-profile class="component" />
                }
            }
        </section>
