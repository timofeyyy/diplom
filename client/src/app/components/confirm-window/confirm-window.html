<div class="confirm-popup">
    <div class="confirm">
        <p class="head">Подтвердите действие</p>
        <p class="subhead">{{confirmMessage}}</p>
        <div class="buttons">
            <button (click)="ok()">Подтвердить</button>
            <button (click)="cancel()">Отменить</button>
        </div>
    </div>
</div>
