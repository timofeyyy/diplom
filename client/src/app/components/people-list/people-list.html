<ul>
    @if(loader) {
         @for (item of currentList; track $index) {
            <li class="phantom">
                <img alt="friends">
                <div class="info"></div>
            </li>
        }
    }
    @else {
           @for (user of currentList; track $index) {
            <li (click)="execCommand(user, $index)">
                <app-avatar [avatar]="user.avatar!" [options]="user.displayAvatarSettings!" [borderRadius]="50" [size]="'max(2.5vw, 25px)'" style="margin: 0 max(1vw, 10px) 0 0;"  />
                <div class="info">
                    <p class="username">{{user.userName}}</p>
                        <p class="when" [innerHTML]="user | displayStatus | async">
                        </p>
                </div>
            </li>
        }
        @empty {
            <li class="empty">Пусто</li>
        }
    }
</ul>
