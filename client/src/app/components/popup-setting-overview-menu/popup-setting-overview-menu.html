<div class="menu">
    <div class="float-menu">
        @if(me) {
        <div class="profile">
            <app-avatar [avatar]="me.avatar" [options]="me.displayAvatarSettings!" [borderRadius]="50" [size]="'max(3.5vw, 35px)'" />
            <p>{{me.userName}}</p>
            <div class="self-managment">
 
            </div>
        </div>
        }
        <ul>
            <li class="user-settings" (click)="userSetings()">
                <div class="icon"></div>
                <p>Настройки пользователя</p>
            </li>
            <li class="themes" (click)="themes()">
                <div class="icon"></div>
                <p>Темы</p>
            </li>
        </ul>
        <div class="log-out" (click)="logout()">
            <div class="wrapper">
                <div class="icon"></div>
                <p>Выход</p>
            </div>
        </div>
    </div>
</div>
