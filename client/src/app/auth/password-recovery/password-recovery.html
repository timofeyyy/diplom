<main>
<form>
    <!-- <h3>{{login ? 'Login' : 'Sign Up'}}</h3> -->
    <div class="wrapper">
        <!-- <p>{{login ? 'Enter your credentionals to accces account' : 'Create your account to start your journey'}} -->
        <!-- </p> -->
        <div [ngClass]="{'field': true, 'invalid': getAuthValidation.validation.email.error ? true : false}">
            <label>Email</label>
            <input type="text" [(ngModel)]="getAuthValidation.validation.email.value" [ngModelOptions]="{ standalone: true }"
                placeholder="Enter email" (change)="validateField(['email', 'email-domen'])" />
            <label class="warning">
                {{getAuthValidation.validation.email.error}}
            </label>
        </div>
        <div [ngClass]="{'field': true, 'invalid': getAuthValidation.validation.password.error ? true : false}">
            <label>Password</label>
            <input type="password" [(ngModel)]="getAuthValidation.validation.password.value" [ngModelOptions]="{ standalone: true }"
                placeholder="Enter password" (change)="validateField(['password-validation-log-in'])" />
            <label class="warning">
                {{getAuthValidation.validation.password.error}}
            </label>
        </div>
    </div>
    <div class="wrapper">
        <button (click)="validateForm()">Send</button>
        <span class="back" (click)="close.emit();getAuthValidation.reset()">Back</span>
    </div>
    <!-- <div class="bottom wrapper"> -->
    <!-- <span class="suggest">{{login ? 'Dont have an account?' : 'Have already account?'}} <span class="form-switch"
                (click)="changeEnterType()">{{login ? 'Sign Up' : 'Sign in'}}</span></span> -->
    <!-- @if(login) { -->
    <!-- } -->
    <!-- </div> -->
</form>
</main>
