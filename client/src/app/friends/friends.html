<div class="friends">
    <section class="people">
        <div class="horizontal-tabs">
            <app-horizontal-tabs>
                <app-tab-list [selectedTab]="chatListType" [tabs]="tabs" />
            </app-horizontal-tabs>
        </div>
        @if(chatListType == ChatListEnum.PEOPLE) {
        <!-- <div class="search">
            <input type="text" [formControl]="searchControl" placeholder="Поиск">
        </div> -->
        <div class="search">
            <app-simple-text-search [searchControl]="searchControl" />
        </div>
        }
        @if(inputValue && result.length) {
        <header>
            <h3>Найдено {{result.length}} людей</h3>
            <div class="line"></div>
        </header>
        }
        <app-people-list [currentList]="result" [loader]="loader" [command]="stateMessanger" />

    </section>
    <section class="chat">
        @if( opponent) {
        <app-messanger [user]="opponent" (close)="opponent = undefined" />
        }

    </section>
</div>
