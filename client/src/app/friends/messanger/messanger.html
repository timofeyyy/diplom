<div class="messanger">
    <header>
        <div class="left">
            <div class="icon icon-back" (click)="close.emit()"></div>
            <div class="user" (click)="openSettings()">
                <p>
                    {{user.userName}}
                </p>
                <p class="when" [innerHTML]="user | displayStatus | async">
                </p>
            </div>
        </div>
        <div class="right">
            <img src="/assets/images/menu-vertical.svg" alt="">
        </div>
    </header>
    <main #scrollMe>
        <div class="messages">
            @if(me) {
            @for (entry of messagesHistory; track $index) {
            <div class="messages-list">
                <div class="date-header">
                    <p>{{ entry[1].date| date: 'LLLL d' }}</p>
                </div>
                @for(message of entry[1].messages; track $index) {
                <div [ngClass]="{'sender': me._id == message.senderId, 'oponnent': me._id != message.senderId}"
                    class="message">
                    <app-attachments-displayer [attahcments]="message.attachments" [ngStyle]="{'margin-bottom': message.message && message.attachments.length ? 'max(1vw, 10px)' : ''}" />
                    @if(message.message) {
                    <div class="text" >
                        <p class="text-message">{{message.message}}</p>
                        <p class="message-date">{{ message.createdAt | date: 'HH:mm' }}</p>
                        <!-- <p class="message-status">status</p> -->
                    </div>
                    }
                </div>
                }
            </div>
            }
            }
            <div #attachWrapper style="position: relative;">
                @if(attachState) {
                <div class="options">
                    <label class="option images">
                        <input type="file" accept="image/*" (change)="onImageSelect($event)">
                        <span class="content">
                            <span class="icon"></span>
                            <span class="text">Изображения</span>
                        </span> 
                    </label>
                    <label class="option images">
                        <input type="file" (change)="onFileSelect($event)">
                        <span class="content">
                            <span class="icon"></span>
                            <span class="text">Файлы</span>
                        </span>
                    </label>
                </div>
                }
            </div>
        </div>
    </main>
    <footer>
        <form>
            <div class="left">
                <div class="icon icon-attach" (click)="attachState =! attachState" >
                    <!-- <img src="/assets/images/clip.svg" alt="attach" (click)="toggleAttach($event)"> -->
                </div>

                <input type="text" [(ngModel)]="input" [ngModelOptions]="{ standalone: true }"
                    placeholder="Write a message...">
            </div>
            <div class="right">
                <button (click)="sendMessage()">
                    <div class="icon icon-send">

                    </div>
                </button>
            </div>
        </form>
    </footer>
</div>
